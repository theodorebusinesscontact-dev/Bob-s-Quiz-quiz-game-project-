<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bob's Quiz</title>
    <link rel="stylesheet" href="stylequiz.css">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Peralta&display=swap" rel="stylesheet">   
</head>
<body>
    <div class="star" style="top: 15%; left: 20%; animation-delay: 1.3s;"></div>
    <div class="star" style="top: 60%; left: 80%; animation-delay: 0.9s;"></div>
    <div class="star" style="top: 80%; left: 35%; animation-delay: 0.5;"></div>
    <div class="star" style="top: 80%; left: 10%; animation-delay: 2.0s;"></div>
    <div class="star" style="top: 30%; left: 90%; animation-delay: 0.9s;"></div>
    <div class="star" style="top: 30%; left: 35%; animation-delay: 0.1;"></div>
    <div class="star" style="top: 35%; left: 50%; animation-delay: 1.3s;"></div>
    <div class="star" style="top: 10%; left: 30%; animation-delay: 0.9s;"></div>
    <div class="star" style="top: 57%; left: 95%; animation-delay: 0.5;"></div>
    <div class="star" style="top: 15%; left: 20%; animation-delay: 1.3s;"></div>
    <div class="star" style="top: 80%; left: 80%; animation-delay: 0.9s;"></div>
    <div class="star" style="top: 67%; left: 90%; animation-delay: 0.5;"></div>    
    <h1 id="title">Theme</h1>
    <button id="back">←</button>
    <div class="secret">
        <h2>YOU WON!</h2>
    </div>
<!-- balls are little icons before the questions and answers-->
    <div class="best">
        <h2>Best score: <span id="nbest"></span></h2>
    </div>
    <div class="score">
        <h2>Score: <span id="nscore"></span></h2>
    </div>
    <div class="Question">
        <span id="ballq"><h2></h2></span><h2 id="questionlabel"></h2>
    </div>
    <div class="answer1">
        <span class="ball"><span id="ball1"><button>A</button></span></span><h2 id="answer1label"></h2>
    </div>
    <div class="answer2">
        <span class="ball"><span id="ball2"><button>B</button></span></span><h2 id="answer2label"></h2>
    </div>
    <div class="answer3">
        <span class="ball"><span id="ball3"><button>C</button></span></span><h2 id="answer3label"></h2>
    </div>
    <div class="answer4">
        <span class="ball"><span id="ball4"><button>D</button></span></span><h2 id="answer4label"></h2>
    </div>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
